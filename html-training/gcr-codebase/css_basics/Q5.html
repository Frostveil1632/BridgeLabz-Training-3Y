<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Feature Card</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: Arial, sans-serif; background-color: #f4f6f9; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .product-card { background: white; width: 320px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); overflow: hidden; text-align: center; padding: 20px; }
        .product-image { width: 100%; height: 200px; background-color: #e2e8f0; border-radius: 8px; display: flex; align-items: center; justify-content: center; color: #64748b; font-weight: bold; margin-bottom: 15px; }
        .product-title { font-size: 1.4rem; color: #1e293b; margin-bottom: 10px; }
        .product-description { font-size: 0.95rem; color: #64748b; margin-bottom: 15px; line-height: 1.5; }
        .product-price { font-size: 1.5rem; color: #2563eb; font-weight: bold; margin-bottom: 15px; }
        .btn-buy { background-color: #2563eb; color: white; border: none; padding: 10px 20px; border-radius: 6px; cursor: pointer; font-size: 1rem; width: 100%; }
        .btn-buy:hover { background-color: #1d4ed8; }
    </style>
</head>
<body>
    <div class="product-card">
        <div class="product-image">Product Preview</div>
        <h3 class="product-title">Smart Wireless Headset</h3>
        <p class="product-description">High-fidelity audio with active noise cancellation and long battery life for immersive sound.</p>
        <div class="product-price">$99.99</div>
        <button class="btn-buy">Add to Cart</button>
    </div>
</body>
</html>
