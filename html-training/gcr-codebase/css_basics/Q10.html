<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>College Tech Hackathon 2026</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: Arial, sans-serif; background-color: #0f172a; color: white; min-height: 100vh; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; padding: 20px; }
        .event-card { background-color: #1e293b; padding: 40px; border-radius: 16px; box-shadow: 0 10px 25px rgba(0,0,0,0.3); max-width: 600px; width: 100%; border: 1px solid #334155; }
        h1 { font-size: 2.2rem; color: #38bdf8; margin-bottom: 15px; }
        p { font-size: 1.1rem; color: #94a3b8; margin-bottom: 25px; line-height: 1.6; }
        .event-details { background-color: #0f172a; padding: 20px; border-radius: 8px; margin-bottom: 25px; text-align: left; }
        .event-details div { margin-bottom: 10px; color: #e2e8f0; }
        .btn-register { background-color: #38bdf8; color: #0f172a; font-weight: bold; border: none; padding: 14px 28px; border-radius: 8px; font-size: 1rem; cursor: pointer; text-decoration: none; display: inline-block; }
        .btn-register:hover { background-color: #0284c7; color: white; }
    </style>
</head>
<body>
    <div class="event-card">
        <h1>Annual Hackathon 2026</h1>
        <p>Join us for 24 hours of innovation, coding, and problem-solving. Build groundbreaking projects with top tech talents!</p>
        <div class="event-details">
            <div>📍 <strong>Venue:</strong> University Campus Tech Center</div>
            <div>📅 <strong>Date:</strong> October 15, 2026</div>
            <div>⏰ <strong>Time:</strong> 09:00 AM IST</div>
        </div>
        <a href="#" class="btn-register">Register Now</a>
    </div>
</body>
</html>
