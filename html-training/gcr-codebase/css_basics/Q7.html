<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Photo Gallery</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: Arial, sans-serif; background-color: #f1f5f9; padding: 40px 20px; }
        h1 { text-align: center; margin-bottom: 30px; color: #0f172a; }
        .gallery { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 20px; max-width: 1100px; margin: 0 auto; }
        .gallery-item { background: white; border-radius: 10px; overflow: hidden; box-shadow: 0 4px 10px rgba(0,0,0,0.1); transition: transform 0.3s ease; }
        .gallery-item:hover { transform: scale(1.03); }
        .gallery-img { width: 100%; height: 180px; background-color: #cbd5e1; display: flex; align-items: center; justify-content: center; color: #475569; font-weight: bold; }
        .gallery-caption { padding: 15px; text-align: center; font-size: 0.95rem; color: #334155; }
    </style>
</head>
<body>
    <h1>Project Gallery</h1>
    <div class="gallery">
        <div class="gallery-item">
            <div class="gallery-img">Image 1</div>
            <div class="gallery-caption">Atlas Workflow Planner</div>
        </div>
        <div class="gallery-item">
            <div class="gallery-img">Image 2</div>
            <div class="gallery-caption">RentEase Marketplace</div>
        </div>
        <div class="gallery-item">
            <div class="gallery-img">Image 3</div>
            <div class="gallery-caption">LegalAI Contract Analyzer</div>
        </div>
        <div class="gallery-item">
            <div class="gallery-img">Image 4</div>
            <div class="gallery-caption">QuickChat Application</div>
        </div>
    </div>
</body>
</html>
